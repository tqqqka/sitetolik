<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Фото</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: #000;
    }

    .photo-card {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      width: min(32vw, 320px);
      opacity: 0;
      will-change: transform;
    }

    .photo-card.ready { opacity: 1; }

    .photo-card img {
      display: block;
      width: 100%;
      max-height: 46svh;
      object-fit: contain;
      object-position: center;
    }

    .nickname {
      color: #fff;
      font-size: clamp(13px, 1.4vw, 16px);
      line-height: 1.2;
      text-decoration: none;
    }

    .advertising-footer {
      position: absolute;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 12px;
      color: #9a9a9a;
      font-size: clamp(11px, 1.15vw, 13px);
      line-height: 1.35;
      text-align: center;
    }

    .advertising-footer a {
      color: #fff;
      text-decoration: none;
    }

    .nickname:hover,
    .nickname:focus-visible,
    .advertising-footer a:hover,
    .advertising-footer a:focus-visible {
      color: #8fc7ff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @media (max-width: 640px) {
      .photo-card { width: min(43vw, 210px); }
      .photo-card img { max-height: 40svh; }
    }
  </style>
</head>
<body>
  <main class="screen">
    <!-- Поддерживаются foto1/foto2 в форматах JPG, JPEG и PNG. -->
    <article class="photo-card" data-position-key="foto1">
      <img src="foto1.jpg" data-fallbacks="foto1.jpeg|foto1.png|foto1.JPG|foto1.JPEG|foto1.PNG" alt="Фото от @fyave">
      <a class="nickname" href="https://t.me/fyave" target="_blank" rel="noopener noreferrer">@fyave</a>
    </article>

    <article class="photo-card" data-position-key="foto2">
      <img src="foto2.jpg" data-fallbacks="foto2.jpeg|foto2.png|foto2.JPG|foto2.JPEG|foto2.PNG" alt="Фото от анонимного автора">
      <span class="nickname">Аноним</span>
    </article>

    <footer class="advertising-footer" id="advertising-footer">
      Поставить сюда своё фото, видео или рекламу:
      <a href="https://t.me/tq2ka" target="_blank" rel="noopener noreferrer">@tq2ka</a>
    </footer>
  </main>

  <script>
    const STORAGE_KEY = 'photo-card-positions-v1';
    const CARD_GAP = 18;
    const cards = Array.from(document.querySelectorAll('.photo-card'));
    const footer = document.getElementById('advertising-footer');
    const images = cards.map((card) => card.querySelector('img'));
    let resizeTimer;

    function readPositions() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      } catch {
        return {};
      }
    }

    function savePositions(positions) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(positions));
      } catch {
        // Если хранилище браузера отключено, страница всё равно продолжит работать.
      }
    }

    function rectanglesOverlap(first, second) {
      return (
        first.left < second.right + CARD_GAP &&
        first.right + CARD_GAP > second.left &&
        first.top < second.bottom + CARD_GAP &&
        first.bottom + CARD_GAP > second.top
      );
    }

    function positionedRect(card, position, edge, footerTop) {
      const box = card.getBoundingClientRect();
      const maxX = Math.max(edge, window.innerWidth - box.width - edge);
      const maxY = Math.max(edge, footerTop - box.height - edge);
      const x = edge + Math.min(1, Math.max(0, position.x)) * Math.max(0, maxX - edge);
      const y = edge + Math.min(1, Math.max(0, position.y)) * Math.max(0, maxY - edge);
      return { left: x, top: y, right: x + box.width, bottom: y + box.height, x, y };
    }

    function positionsAreUsable(positions, edge, footerTop) {
      const saved = cards.every((card) => {
        const position = positions[card.dataset.positionKey];
        return Number.isFinite(position?.x) && Number.isFinite(position?.y);
      });

      if (!saved) return false;

      const first = positionedRect(cards[0], positions.foto1, edge, footerTop);
      const second = positionedRect(cards[1], positions.foto2, edge, footerTop);
      return !rectanglesOverlap(first, second);
    }

    function tryNextImageFormat(image) {
      const fallbacks = (image.dataset.fallbacks || '').split('|').filter(Boolean);
      const index = Number(image.dataset.fallbackIndex || '0');

      if (index < fallbacks.length) {
        image.dataset.fallbackIndex = String(index + 1);
        image.src = fallbacks[index];
        return;
      }

      placeCards();
    }

    function createPositions(edge, footerTop) {
      const positions = {};
      const occupied = [];

      cards.forEach((card) => {
        const anchors = [
          { x: 0, y: 0 }, { x: 1, y: 0 }, { x: 0, y: 1 }, { x: 1, y: 1 },
          { x: 0.5, y: 0 }, { x: 0.5, y: 1 }, { x: 0, y: 0.5 }, { x: 1, y: 0.5 }
        ];
        let position = { x: Math.random(), y: Math.random() };
        let candidate = positionedRect(card, position, edge, footerTop);
        let found = occupied.every((other) => !rectanglesOverlap(candidate, other));

        for (let attempt = 0; !found && attempt < 160; attempt += 1) {
          position = { x: Math.random(), y: Math.random() };
          candidate = positionedRect(card, position, edge, footerTop);
          found = occupied.every((other) => !rectanglesOverlap(candidate, other));
        }

        for (const anchor of anchors) {
          if (found) break;
          const anchoredCandidate = positionedRect(card, anchor, edge, footerTop);
          if (occupied.every((other) => !rectanglesOverlap(anchoredCandidate, other))) {
            position = anchor;
            candidate = anchoredCandidate;
            found = true;
          }
        }

        positions[card.dataset.positionKey] = position;
        occupied.push(candidate);
      });

      savePositions(positions);
      return positions;
    }

    function placeCards() {
      if (!images.every((image) => image.complete)) return;

      const edge = window.innerWidth < 640 ? 12 : 24;
      const footerTop = footer.getBoundingClientRect().top;
      let positions = readPositions();

      if (!positionsAreUsable(positions, edge, footerTop)) {
        positions = createPositions(edge, footerTop);
      }

      cards.forEach((card) => {
        const position = positions[card.dataset.positionKey];
        const rect = positionedRect(card, position, edge, footerTop);

        card.style.transform = `translate3d(${Math.round(rect.x)}px, ${Math.round(rect.y)}px, 0)`;
        card.classList.add('ready');
      });
    }

    images.forEach((image) => {
      image.addEventListener('load', placeCards);
      image.addEventListener('error', () => tryNextImageFormat(image));
    });

    window.addEventListener('load', placeCards);
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(placeCards, 100);
    });
  </script>
</body>
</html>
